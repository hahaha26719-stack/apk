<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} · {{ school_name }}</title>
  <link rel="icon" href="/static/img/logo.png" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="topbar">
    <img src="/static/img/logo.png" alt="Ohr Temimim logo" />
    <div class="titles">
      <div class="he">{{ school_name_he }}</div>
      <div class="en">{{ school_name }} — Admin</div>
    </div>
    <div class="spacer"></div>
    <div class="user">
      {{ admin.full_name or admin.username }}
      <a href="/logout">Log out</a>
    </div>
  </div>

  <div class="layout">
    <nav class="sidebar">
      <a href="/" class="{{ 'active' if active=='dashboard' }}">📊 Dashboard</a>
      <a href="/students" class="{{ 'active' if active=='students' }}">🎓 Students</a>
      <a href="/attendance" class="{{ 'active' if active=='attendance' }}">🕒 Attendance</a>
      <a href="/classes" class="{{ 'active' if active=='classes' }}">🏫 Classes</a>
      <a href="/admins" class="{{ 'active' if active=='admins' }}">👤 Admin Users</a>
      <a href="/audit" class="{{ 'active' if active=='audit' }}">📜 Audit Log</a>
      <a href="/export/students.csv">⬇️ Export Students</a>
      <a href="/export/attendance.csv">⬇️ Export Attendance</a>
    </nav>

    <main class="content">
      {% if flash %}
      <div class="flash {{ flash_type or 'ok' }}">{{ flash }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
