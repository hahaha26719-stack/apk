<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · {{ school_name }}</title>
  <link rel="icon" href="/static/img/logo.png" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" method="post" action="/login">
      <img src="/static/img/logo.png" alt="Ohr Temimim logo" />
      <div class="he">{{ school_name_he }}</div>
      <h1>{{ school_name }}</h1>
      <div style="color:#6b7280;font-size:13px;">Admin Panel</div>
      {% if error %}<div class="flash err" style="margin-top:16px;">{{ error }}</div>{% endif %}
      <label for="username" style="text-align:left;">Username</label>
      <input id="username" name="username" autofocus required />
      <label for="password" style="text-align:left;">Password</label>
      <input id="password" name="password" type="password" required />
      <button class="btn gold" type="submit">Sign In</button>
    </form>
  </div>
  <div class="footer">{{ school_name }} · {{ school_name_he }}</div>
</body>
</html>
