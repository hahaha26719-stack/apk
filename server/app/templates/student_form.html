{% extends "base.html" %}
{% block title %}{{ 'Edit' if student else 'Add' }} Student{% endblock %}
{% block content %}
<h1 class="page-title">{{ 'Edit' if student else 'Add' }} Student</h1>

<div class="card" style="max-width:720px;">
  <form method="post" action="{{ action }}">
    <div class="row">
      <div><label>Student ID *</label><input name="student_id" required value="{{ student.student_id if student else '' }}" /></div>
      <div><label>Grade</label><input name="grade" value="{{ student.grade if student else '' }}" /></div>
    </div>
    <div class="row">
      <div><label>First Name *</label><input name="first_name" required value="{{ student.first_name if student else '' }}" /></div>
      <div><label>Last Name *</label><input name="last_name" required value="{{ student.last_name if student else '' }}" /></div>
    </div>
    <div class="row">
      <div>
        <label>Class</label>
        <select name="class_id">
          <option value="">— None —</option>
          {% for c in classes %}
          <option value="{{ c.id }}" {{ 'selected' if student and student.class_id==c.id }}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>Active</label>
        <select name="is_active">
          <option value="1" {{ 'selected' if not student or student.is_active }}>Yes</option>
          <option value="0" {{ 'selected' if student and not student.is_active }}>No</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label>Email</label><input name="email" value="{{ student.email if student else '' }}" /></div>
      <div><label>Phone</label><input name="phone" value="{{ student.phone if student else '' }}" /></div>
    </div>
    <div class="row">
      <div><label>Guardian Name</label><input name="guardian_name" value="{{ student.guardian_name if student else '' }}" /></div>
      <div><label>Guardian Phone</label><input name="guardian_phone" value="{{ student.guardian_phone if student else '' }}" /></div>
    </div>
    <label>Notes</label>
    <textarea name="notes" rows="3">{{ student.notes if student else '' }}</textarea>
    <div style="margin-top:18px;">
      <button class="btn gold" type="submit">Save</button>
      <a class="btn ghost" href="/students">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
